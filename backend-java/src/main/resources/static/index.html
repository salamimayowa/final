<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Toxicity Demo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Toxic Comment Filter — Demo</h1>
      <p>Enter text below to analyze toxicity using the server-side BERT detector.</p>

      <textarea id="inputText" placeholder="Type or paste text here" rows="6"></textarea>
      <div class="controls">
        <label for="sensitivity">Sensitivity: <span id="sensitivityValue">0.5</span></label>
        <input id="sensitivity" type="range" min="0.1" max="0.9" step="0.1" value="0.5">
        <button id="analyzeBtn">Analyze</button>
      </div>

      <div id="result" class="result hidden">
        <h2>Analysis Result</h2>
        <pre id="raw"></pre>
        <div><strong>Toxic:</strong> <span id="isToxic"></span></div>
        <div><strong>Score:</strong> <span id="score"></span></div>
        <div><strong>Categories:</strong> <span id="categories"></span></div>
        <div><strong>Filtered Text:</strong></div>
        <div id="filtered" class="filtered"></div>
      </div>

      <div id="error" class="error hidden"></div>
    </div>
    <script src="/app.js"></script>
  </body>
  </html>
